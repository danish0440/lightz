[package]
name = "lightz-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightZ engine: session, command registry, history, render jobs, view-models (L4)"

[lints]
workspace = true

[dependencies]
# Paths stored in a Lightroom catalog are followed only to local files or the catalog's share.
craft-docpath = { workspace = true }
lightz-geom = { workspace = true }
lightz-color = { workspace = true }
lightz-raster = { workspace = true }
lightz-develop = { workspace = true }
lightz-scenes = { workspace = true }
lightz-pipeline = { workspace = true }
lightz-gpu = { workspace = true }
lightz-catalog = { workspace = true }
web-time = { workspace = true }
lightz-preview = { workspace = true }
lightz-codecs = { workspace = true }
lightz-raw = { workspace = true }
lightz-denoise-core = { workspace = true }
lightz-denoise = { workspace = true, optional = true }
lightz-meta = { workspace = true }
lightz-lensdb = { workspace = true }
lightz-faces = { workspace = true }
miniz_oxide = { workspace = true }
lightz-merge = { workspace = true }
lightz-geocode = { workspace = true }
lightz-slideshow = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
ab_glyph = { workspace = true }
# Apply the font’s vertical substitutions and origins to Japanese watermarks.
harfrust = { version = "0.12", default-features = false, features = ["std"] }
unicode-segmentation = "1.13"
lightz-segment = { workspace = true, optional = true }

# model downloads run natively only (the web build fetches no models)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lightz-fetch = { workspace = true }
# capture-time parsing for face recognition (native only)
chrono = { workspace = true }

[features]
# AI masks with SAM 3 (Object / Describe). Off for the web and CLI builds.
sam = ["dep:lightz-segment"]
denoise = ["dep:lightz-denoise", "lightz-denoise/runtime", "lightz-gpu/denoise"]
rawnind-model = ["denoise", "lightz-denoise/rawnind-model", "lightz-denoise-core/rawnind-model"]

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
lightz-testkit = { workspace = true }
# HDR JPEG XL tests read the file's colour encoding
jxl-oxide = { workspace = true }
# Lossless synthetic HEIC files (the import test; decoded when the codecs' `heif` feature is on).
lightz-heif = { workspace = true, features = ["testdata"] }
libc = { workspace = true }
lightz-tiff = { workspace = true }
