[package]
name = "lightz-raw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightZ RAW decoding, demosaicing and DNG colour model (L1)"

[lints]
workspace = true

[dependencies]
craft-tiff = { workspace = true }
craft-raw = { workspace = true }
lightz-meta = { workspace = true }
lightz-raster = { workspace = true }
lightz-color = { workspace = true }
lightz-geom = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
miniz_oxide = { workspace = true }
zune-jpeg = { workspace = true }
zune-core = { workspace = true }
jpeg-encoder = { workspace = true }

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
lightz-testkit = { workspace = true }
proptest = { workspace = true }
zune-jpegxl = { workspace = true }
# Pinned CC0 corpus identities; not a product dependency.
sha2 = { version = "0.10", default-features = false, features = ["std"] }
# Peak-heap regression tests (tests/sr2_heap.rs); not a product dependency.
dhat = { workspace = true }
