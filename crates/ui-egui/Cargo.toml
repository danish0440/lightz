[package]
name = "lightz-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LightZ egui frontend (Lightroom-style UI); swappable — nothing below depends on it (L5)"

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
craft-window = { workspace = true }
lightz-geom = { workspace = true }
lightz-meta = { workspace = true }
lightz-color = { workspace = true }
lightz-raster = { workspace = true }
lightz-develop = { workspace = true }
lightz-pipeline = { workspace = true }
lightz-catalog = { workspace = true }
web-time = { workspace = true }
lightz-engine = { workspace = true }
lightz-slideshow = { workspace = true }
lightz-preview = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
lightz-testkit = { workspace = true }
# The model-setup tests install and resume a real denoise model. Without this the engine's
# `default_loader` is the "this build cannot run denoise models" stub when the package is tested
# on its own (`cargo test -p lightz-ui-egui`); a workspace test only passed by feature
# unification with the desktop app's default `denoise` feature.
lightz-engine = { workspace = true, features = ["denoise"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
lightz-denoise = { workspace = true, features = ["runtime"] }
lightz-codecs = { workspace = true }
lightz-faces = { workspace = true }
lightz-merge = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-update = { workspace = true }
