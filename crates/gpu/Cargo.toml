[package]
name = "lightz-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightZ GPU develop pipeline: wgpu compute (WGSL) twin of the CPU pipeline, which stays the reference (L3)"

[lints]
workspace = true

[dependencies]
lightz-denoise = { workspace = true, optional = true }
lightz-geom = { workspace = true }
lightz-color = { workspace = true }
lightz-raster = { workspace = true }
lightz-develop = { workspace = true }
lightz-faces = { workspace = true }
lightz-pipeline = { workspace = true }
log = { workspace = true }

# Native only: Metal / Vulkan / DX12 through wgpu (pure Rust; the drivers are the system's).
# The browser build keeps the CPU pipeline (WebGPU needs async device creation: see docs/gpu-pipeline.md).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }
# the SAM 3 backbone kernels (`sam` feature) implement `lightz_segment::BackboneAccel`
lightz-segment = { workspace = true, optional = true }

[features]
default = []
denoise = ["dep:lightz-denoise", "lightz-denoise/runtime"]
# SAM 3's vision backbone on the GPU (`sam3`); the engine's `sam` feature turns it on
sam = ["dep:lightz-segment"]

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
lightz-testkit = { workspace = true }
lightz-scenes = { workspace = true }
lightz-raw = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# the SAM 3 backbone test and benchmark compare against the candle backbone
candle-core = { workspace = true }

[[example]]
name = "sam3_backbone_bench"
required-features = ["sam"]
