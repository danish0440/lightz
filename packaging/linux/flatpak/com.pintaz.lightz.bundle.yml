# Flatpak manifest for the single-file bundle attached to every GitHub release
# (lightz-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (lightz-<version>-linux-<arch>.tar.gz,
# built on Ubuntu 22.04 by package.sh) instead of compiling Rust inside flatpak-builder: no
# network and no vendored crate sources during the build, a few seconds instead of 20+ minutes,
# and byte-for-byte the same binaries as the AppImage/deb/rpm. The script unpacks the tarball
# into `stage/` next to a copy of this file. The binaries need glibc >= 2.35 and load X11,
# Wayland, xkbcommon and Vulkan at runtime; the freedesktop runtime has all of them, and the
# GPU driver comes from its org.freedesktop.Platform.GL extension.
#
# com.pintaz.lightz.yml (same directory) is the from-source manifest for Flathub. Keep
# runtime-version and finish-args identical in both (packaging-lint checks this).
id: com.pintaz.lightz
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: lightz
finish-args:
  - --filesystem=xdg-data/ArtCraft/versions:ro
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Screen readers: AccessKit asks the accessibility bus (org.a11y.Bus) whether one is running and
  # publishes the window there over AT-SPI. Without it the sandbox hides the bus and the app is
  # invisible to Orca and other assistive technology.
  - --talk-name=org.a11y.Bus
  # The library lives in ~/Pictures/LightZ Library by default, and imports usually come from
  # Pictures. Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend) and
  # drag-and-drop through the document portal, so picked folders elsewhere work without broad
  # filesystem access.
  - --filesystem=xdg-pictures
  # Deliberately not granted: home/host filesystem access. Network is needed for update checks
  # against GitHub and the optional SAM 3 model download (AI Object/Describe masks,
  # docs/ai-masks.md).
  - --share=network
modules:
  - name: lightz
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/lightz /app/bin/lightz
      - install -Dm755 bin/lightz-cli /app/bin/lightz-cli
      - install -Dm644 share/applications/com.pintaz.lightz.desktop /app/share/applications/com.pintaz.lightz.desktop
      # The same MIME definitions the deb/rpm install.
      - install -Dm644 share/mime/packages/com.pintaz.lightz.xml /app/share/mime/packages/com.pintaz.lightz.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/com.pintaz.lightz.metainfo.xml /app/share/metainfo/com.pintaz.lightz.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/lightz /app/share/doc/
    sources:
      - type: dir
        path: stage
